    <script>
        let _isMobile = false;
        let _isTablet = false;
        const _container = document.querySelector(".container");
        let timerFunc;
        window.addEventListener("message", (e) => {
            if (e.data.type == "init") {
                if (e.data.isMobile) {
                    _isMobile = true;
                    _container.classList.add("mobile")
                }

                if (e.data.isTablet) {
                    _isTablet = true;
                }

                document.querySelector(".desc").innerHTML = e.data.sideapps_office_management_warn_media.replace("\n", "<br/>");
                WidgetRearrangeByScreenWidth();
                setTimeout(() => {
                    if (_container.style.opacity == 0) {
                        _container.style.opacity = 1;
                    }
                }, 250)
                if (timerFunc) {
                    clearTimeout(timerFunc)
                }
                timerFunc = setTimeout(closeWidget, 3000)
            } else if (e.data.type == "hidden") {
                document.querySelector(".container").style.opacity = 0;
            }

        })


        function closeWidget() {
            window.parent.postMessage({ type: "close" }, '*')
            window.parent.postMessage(
                {
                    type: "WidgetRearrange",
                    height: `0px`,
                    width: "0",
                },
                "*"
            );
            window.parent.focus();
        }

        function WidgetRearrangeByScreenWidth() {
            const safeAreaTopHeight = getComputedStyle(document.documentElement).getPropertyValue('--sat').trim();
            if (_isMobile && !_isTablet) {
                window.parent.postMessage(
                    {
                        type: "WidgetRearrange",
                        height: `${_container.clientHeight}px`,
                        width: "100%",
                        anchor: "top",
                        top: `${82 + parseInt(safeAreaTopHeight)}px`,
                        zIndex: 9999,
                    },
                    "*"
                );
            } else {
                window.parent.postMessage(
                    {
                        type: "WidgetRearrange",
                        height: `${_container.clientHeight}px`,
                        width: "100%",
                        anchor: "top",
                        top: `${(_isTablet ? 124 : 104) - parseInt(0) + parseInt(safeAreaTopHeight)}px`,
                        zIndex: 9999,
                    },
                    "*"
                );
            }
        }
    </script>
